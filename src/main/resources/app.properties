# ==========================================================
#  CrisisConnect - application configuration
#  (copy to ./config/app.properties to override any value)
# ==========================================================

app.name=CrisisConnect
app.version=1.0.0

# ---- Database (JDBC) ----
db.url=jdbc:sqlite:data/crisisconnect.db
db.seedSampleData=true

# ---- Matching engine ----
# Resources further than this are never considered
match.maxRadiusKm=180
# Run matching automatically every N seconds (0 = manual only)
match.autoIntervalSeconds=0

# ---- REST API + website ----
api.enabled=true
api.port=8080
api.webRoot=website

# ---- Logging ----
log.level=INFO
log.dir=logs

# ---- File exports / backups ----
export.dir=exports
backup.dir=backups
