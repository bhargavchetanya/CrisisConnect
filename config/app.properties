# ==========================================================
#  CrisisConnect - application configuration
#  (copy to ./config/app.properties to override any value)
# ==========================================================

app.name=CrisisConnect
app.version=1.0.0

# ---- Database (JDBC) ----
db.url=jdbc:sqlite:data/crisisconnect.db
db.seedSampleData=true

# ---- Matching engine ----
# Resources further than this are never considered
match.maxRadiusKm=180
# Run matching automatically every N seconds (0 = manual only)
match.autoIntervalSeconds=0

# ---- REST API + website ----
api.enabled=true
api.port=8080
api.webRoot=website

# ---- Logging ----
log.level=INFO
log.dir=logs

# ---- File exports / backups ----
export.dir=exports
backup.dir=backups

# ---- Accounts & security (web console) ----
# Administrators (comma separated). Their accounts are created automatically at start-up.
admin.emails=bhargavchetanya47@gmail.com
# Do NOT put the admin password here - set the ADMIN_PASSWORD environment variable instead.
# If it is not set, a random password is printed once in the server log.
auth.session.hours=24
# Show the e-mail verification code on screen when no e-mail provider is configured (demo convenience)
auth.show.dev.codes=true
# Public demo coordinator: coordinator@demo.crisisconnect.in / DemoPass#2026
demo.accounts=true

# ---- Notifications (SMS / WhatsApp simulation + e-mail) ----
# Public address used in messages. On Render, RENDER_EXTERNAL_URL is used automatically.
app.public.url=
# Organizations within this distance get a WhatsApp alert for every CRITICAL SOS
notify.critical.radiusKm=60
# Real e-mail through Brevo (optional): set BREVO_API_KEY and EMAIL_FROM environment variables
email.from.name=CrisisConnect

# ---- Real WhatsApp alerts (Twilio) ----
# Set on the server (Render -> Environment), never in this file - the repository is public:
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM (default: Twilio sandbox +14155238886)
#   ADMIN_WHATSAPP          administrator's mobile - receives every alert
#   WHATSAPP_ALERT_NUMBERS  comma-separated mobiles that receive every SOS (disaster + city)
# Only these numbers get real WhatsApp; other numbers stay simulated unless this is true:
whatsapp.send.to.all=false

# ---- Google sign-in ----
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET on the server.
# Authorized redirect URI in Google Cloud: <public URL>/api/auth/google/callback
